name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer push to a PR supersedes the older run. A push to main gets a group of its
  # own (its SHA): GitHub cancels a *pending* run in a shared group even when
  # cancel-in-progress is false, and every commit that lands must keep its own result.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: Version string sync across duplicated locations
      # The version has no single source of truth; this fails the build when a
      # bump misses web/package.json, Helm, deploy/*.yaml or server.go. Same
      # command locally: ./scripts/check-version-sync.sh
      run: ./scripts/check-version-sync.sh
    - run: go mod tidy
    - name: go.mod and go.sum are tidy
      run: git diff --exit-code go.mod go.sum
    - name: gofmt is clean
      # Same command locally: gofmt -l $(git ls-files '*.go')
      run: |
        unformatted="$(gofmt -l $(git ls-files '*.go'))"
        if [ -n "$unformatted" ]; then
          echo "not gofmt-formatted (run: make fmt):" >&2
          echo "$unformatted" >&2
          exit 1
        fi
    - name: shellcheck (warnings and above)
      # Same command locally: shellcheck -S warning scripts/*.sh scripts/lib/*.sh hack/*.sh examples/*.sh
      run: shellcheck -S warning scripts/*.sh scripts/lib/*.sh hack/*.sh examples/*.sh
    - run: go test ./...
    - name: Features catalog + CLI status unit (scripted)
      # Dedicated gate for Cilium-style features/status/banner so regressions
      # cannot hide inside a broad `go test ./...` log. Same command locally:
      # ./scripts/ci-features-unit.sh
      run: ./scripts/ci-features-unit.sh
    - name: netractl all-commands catalog (mock API)
      # Exhaustive argv→HTTP coverage for every catalogued netractl command
      # (read + representative mutates) against httptest. Same command locally:
      # ./scripts/ci-netractl-commands.sh
      run: ./scripts/ci-netractl-commands.sh
    - name: netractl full suite against live local netrad
      # Boots netrad on an ephemeral HTTP port and runs the detailed
      # remote command board (not smoke). Same command locally:
      # ./scripts/ci-netractl-live.sh
      run: ./scripts/ci-netractl-live.sh
    - name: P1–P5 surface unit + race (scripted)
      # Dedicated gate for the metadata surfaces (tlsfp, encdns, fleet,
      # shadow-saas, prevention, exfil/lateral/ECH, …) so regressions
      # cannot hide inside a broad `go test ./...` log. Same command
      # locally: ./scripts/ci-p1-p5-unit.sh
      run: ./scripts/ci-p1-p5-unit.sh
    - name: TLS fingerprint unit + race (scripted)
      run: ./scripts/ci-tlsfp-unit.sh
    - name: Agent mutual TLS unit + race (scripted)
      # Real TLS listeners and certificates: handshake by issuer/usage/expiry,
      # optional vs required, rotation, the API policy and the agent's client.
      # Same command locally: ./scripts/ci-mtls-unit.sh
      run: ./scripts/ci-mtls-unit.sh
    - name: Kernel sensors (TCP events, drop attribution) unit + race (scripted)
      # tracepoint format parsing against real 6.8 files, layouts, reason
      # names, kallsyms, agent modes, controller aggregation and metric bounds;
      # asserts a minimum test count per step so a renamed test cannot silently
      # drop out. The kernel half is the `ebpf` job. Same command locally:
      # ./scripts/ci-kernel-sensors-unit.sh
      run: ./scripts/ci-kernel-sensors-unit.sh
    - name: TLS plaintext sampling unit + race (scripted)
      # amd64/arm64 register layouts, event decode, libssl discovery, plaintext
      # classification (no request text in a result), agent modes, the separate TLS
      # API view and metric family. The kernel half runs in the `ebpf` jobs.
      # Same command locally: ./scripts/ci-sslprobe-unit.sh
      run: ./scripts/ci-sslprobe-unit.sh
    - name: Sampled L7 protocol parsers unit + race + fuzz (scripted)
      # Redis/Postgres/MySQL/Kafka/HTTP1/HTTP2/gRPC classifiers and the bounded
      # counters: no secret reaches an output field, every label is bounded (200k
      # random inputs + a 20s fuzz), nothing panics. The kernel half runs in the
      # `ebpf` job. Same command locally: ./scripts/ci-l7sample-unit.sh
      run: ./scripts/ci-l7sample-unit.sh
    - name: Listen-queue sampling unit + race, real inet_diag (scripted)
      # Accept-queue depth per listener: fill arithmetic, histogram, peaks, the
      # real kernel's inet_diag (backlog-1 listener that never accepts, IPv6,
      # accept draining the queue, /proc/net/tcp cross-check), agent modes and
      # controller aggregation. Same command locally: ./scripts/ci-listenq-unit.sh
      run: ./scripts/ci-listenq-unit.sh
    - name: Netlink change recorder unit + race (scripted)
      # Read-only RTNL recorder: bounded ring and delivery cursor (a failed POST
      # resends), resubscribe after ENOBUFS, neighbor-churn suppression, snapshot
      # generation and caps, controller history dedupe across agent restarts, API
      # views and metric bounds. The real-kernel half runs in `netlink-veth-smoke`.
      # Same command locally: ./scripts/ci-netlink-unit.sh
      run: ./scripts/ci-netlink-unit.sh
    - name: BPF attachment inventory unit + race (scripted)
      # Read-only inventory of XDP/TCX/classic-tc attachments and the drift check
      # between what the agent believes it attached and what the kernel reports:
      # owner classification, the kernel's 15-character program names, a query that
      # failed is unknown and never "detached", the unchanged-summary protocol, and
      # the controller carry-forward. The real-kernel half runs in the `ebpf` job.
      # Same command locally: ./scripts/ci-bpfattach-unit.sh
      run: ./scripts/ci-bpfattach-unit.sh
    - name: Metrics platform unit + race (scripted)
      # Per-second metrics: tiered Gorilla store, collectors against /proc and /sys
      # fixtures (process groups never read cmdline/environ), app collectors against
      # fake endpoints, host-netns discovery, workload RED, the agent stream, ML
      # anomalies, metric alerts, exporters, and the query/evidence/fleet/AI APIs.
      # The real-kernel half runs in `metrics-veth-smoke`.
      # Same command locally: ./scripts/ci-metrics-unit.sh
      run: ./scripts/ci-metrics-unit.sh
    - name: Deploy guards (scripted)
      # deploy-remote.sh imports images under a fixed tag and kubelet's image GC can
      # remove one before its pod starts (ImagePullBackOff, helm still "succeeds").
      # Exercises the disk guard, the image re-import and the readiness wait against
      # stubbed df/k3s/kubectl, and checks the rendered remote script parses and
      # orders builds, imports and helm correctly. Same command locally:
      # ./scripts/ci-deploy-guards.sh
      run: ./scripts/ci-deploy-guards.sh
    - name: OIDC login + RBAC + metrics-token unit + race (scripted)
      # JWT verifier attacks (alg none/HS256/audience/issuer/forged kid),
      # the role table over the real route set, spoof-proof audit actor and
      # the /metrics gate. Same command locally: ./scripts/ci-auth-unit.sh
      run: ./scripts/ci-auth-unit.sh
    - name: OTLP push unit + race (scripted)
      # /metrics→OTLP conversion, watermark/retry/batching, HA leader-only
      # lifecycle (repeated under -race). Same command locally:
      # ./scripts/ci-otlp-unit.sh
      run: ./scripts/ci-otlp-unit.sh
    - name: Loki push sink + shared delivery logic unit + race (scripted)
      # Client vs a fake decoding real push payloads (bounded labels, gzip and
      # size split, retry vs drop of a rejected batch), shared pushfeed, and
      # netrad wiring. Same command locally: ./scripts/ci-loki-unit.sh
      run: ./scripts/ci-loki-unit.sh
    - name: Workload metrics + SLO unit + race (scripted)
      # Per-workload monotonic counters (pod churn, agent resets, stale nodes,
      # cardinality cap), SLO registry extensions, observer burn/recovery
      # lifecycle, /metrics + /api/v1/slo. Same command locally:
      # ./scripts/ci-workload-obs-unit.sh
      run: ./scripts/ci-workload-obs-unit.sh
    - name: Race-detect HA leader election (no-double-ship push sinks)
      # electionLoop's promote/demote wiring is what both startSyslog and
      # startSnowflake rely on to guarantee only the active leader ever
      # ships to a collector/warehouse. -count=5 gives the concurrent
      # lease-race + mid-test handoff a few independent shots under the
      # race detector rather than relying on a single pass.
      run: go test ./cmd/netrad/... -run TestElectionLoopNeverDoubleShipsPushSinks -race -count=5
    - name: Race-detect the recent detector/sink/notify/auto-capture batch
      # These packages are new and hold mutex-protected state shared between
      # a background poller goroutine and an HTTP handler (the same shape
      # the netrad race step above exists for) — scoped here rather than
      # broadened onto the main `go test ./...` step above so a real but
      # unrelated pre-existing race elsewhere in the module can't turn this
      # batch's CI red for a reason having nothing to do with it.
      # notify/alert/webhook: multi-channel dispatcher fans events to channels
      # concurrently from poller workers. capture: auto-capture ArtifactStore
      # writes PCAPs while the poller may start sessions on the same node.
      run: go test ./internal/denysim/... ./internal/dnsdetect/... ./internal/scandetect/... ./internal/tlsfp/... ./internal/slo/... ./internal/snowflakesink/... ./internal/notify/... ./internal/alert/... ./internal/webhook/... ./internal/capture/... -race
    - name: Auto-capture unit tests (triggers, cooldown, PCAP artifact store)
      # Focused gate for the opt-in heavy-load auto-capture path so a
      # regression in ShouldTrigger / ArtifactStore prune can't hide inside
      # the broader package race batch above.
      run: go test ./internal/alert/... ./internal/capture/... -run 'ShouldTrigger|AutoCapture|ArtifactStore|ParseAutoRequestor' -count=1
    - run: go vet ./...
    - name: Whole module builds off Linux and for arm64
      # The sensors have Linux-only loaders and stubs elsewhere (and the release
      # ships arm64 images); CI runs only on linux/amd64, so a break on the
      # other side would otherwise surface on a developer's Mac or at release.
      run: |
        GOOS=darwin GOARCH=arm64 go build ./...
        GOOS=linux GOARCH=arm64 go build ./...
        GOOS=linux GOARCH=arm64 go vet -tags 'linux bpfintegration' ./bpf/...
    - run: go build ./cmd/netrad ./cmd/netractl ./cmd/netra-agent ./cmd/netra-doctor ./cmd/netra-mcp
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
    # `ci`, not `install`: build from the lockfile, exactly as the Dockerfile does.
    - run: npm --prefix web ci
    - run: npm --prefix web run typecheck
    - run: npm --prefix web test
    - run: npm --prefix web run build
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with: {node-version: '22', cache: npm, cache-dependency-path: website/package-lock.json}
    - run: npm --prefix website ci
    - run: npm --prefix website run build
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: azure/setup-helm@v5
    - name: Secure default must reject missing credentials
      run: |
        if helm template insecure helm/netra >/tmp/netra-insecure.yaml 2>/tmp/netra-insecure.err; then
          echo "chart unexpectedly rendered without authentication" >&2
          exit 1
        fi
    - run: helm lint helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key
    - run: helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key >/tmp/netra.yaml
    - name: Default render must not grant Cilium RBAC
      run: |
        if grep -q 'cilium.io' /tmp/netra.yaml; then
          echo "standalone chart unexpectedly rendered Cilium RBAC" >&2
          exit 1
        fi
    - name: Default render must expose HTTPS 30870 with TLS and inventory RBAC
      run: |
        grep -q 'containerPort: 30870' /tmp/netra.yaml
        grep -q 'NETRA_LISTEN' /tmp/netra.yaml
        grep -q 'NETRA_TLS_CERT' /tmp/netra.yaml
        grep -q 'NETRA_TLS_KEY' /tmp/netra.yaml
        grep -q 'gen-cert' /tmp/netra.yaml
        grep -q 'scheme: HTTPS' /tmp/netra.yaml
        grep -q 'name: https' /tmp/netra.yaml
        grep -q 'resources: \["pods","services"\]' /tmp/netra.yaml
        grep -q 'kubevirt.io' /tmp/netra.yaml
        # Helm renders env as name/value pairs; Cilium must stay off by default.
        awk '/name: NETRA_CILIUM_ENABLED/{getline; if ($0 ~ /"true"/) exit 1}' /tmp/netra.yaml
        grep -q 'name: NETRA_CILIUM_ENABLED' /tmp/netra.yaml
        grep -q 'name: NETRA_HUBBLE_ENABLED' /tmp/netra.yaml
        # Opt-out path still works when explicitly disabled.
        helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key --set tls.enabled=false >/tmp/netra-notls.yaml
        if grep -q 'NETRA_TLS_CERT' /tmp/netra-notls.yaml; then
          echo "tls.enabled=false unexpectedly rendered NETRA_TLS_CERT" >&2
          exit 1
        fi
        grep -q 'name: http' /tmp/netra-notls.yaml
        # Node agent DaemonSet is on by default (one pod per node).
        grep -q 'kind: DaemonSet' /tmp/netra.yaml
        grep -q 'name: netra-agent' /tmp/netra.yaml
        # TLS fingerprint sampler env + features RBAC for live toggles.
        grep -q 'name: NETRA_TLSFP' /tmp/netra.yaml
        awk '/name: NETRA_TLSFP$/{getline; if ($0 !~ /"auto"/) exit 1}' /tmp/netra.yaml
        grep -q 'netra-features' /tmp/netra.yaml
        grep -q 'resources: \["deployments", "daemonsets"\]' /tmp/netra.yaml
        helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key --set agent.enabled=false >/tmp/netra-noagent.yaml
        if grep -q 'kind: DaemonSet' /tmp/netra-noagent.yaml; then
          echo "agent.enabled=false unexpectedly rendered DaemonSet" >&2
          exit 1
        fi
        helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key --set agent.tlsfp=off >/tmp/netra-tlsfp-off.yaml
        awk '/name: NETRA_TLSFP$/{getline; if ($0 !~ /"off"/) exit 1}' /tmp/netra-tlsfp-off.yaml
    - name: Agent kernel sensors are wired into the chart (tracefs mount, modes)
      # Without the host tracefs mount a container's /sys has no tracefs, and
      # both the TCP event sensors and the kfree_skb drop-reason sensor report
      # "unavailable" on a real cluster; nothing else would notice.
      run: |
        grep -q 'name: NETRA_TCP_EVENTS' /tmp/netra.yaml
        awk '/name: NETRA_TCP_EVENTS$/{getline; if ($0 !~ /"auto"/) exit 1}' /tmp/netra.yaml
        grep -q 'name: NETRA_DROP_INFO' /tmp/netra.yaml
        awk '/name: NETRA_DROP_INFO$/{getline; if ($0 !~ /"auto"/) exit 1}' /tmp/netra.yaml
        grep -q 'mountPath: /sys/kernel/tracing' /tmp/netra.yaml
        grep -q 'path: /sys/kernel/tracing' /tmp/netra.yaml
        # The mount is read-only.
        awk '/mountPath: \/sys\/kernel\/tracing/{getline; if ($0 !~ /readOnly: true/) exit 1}' /tmp/netra.yaml
        helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set agent.hostTracefs=false --set agent.tcpEvents=off --set agent.dropInfo=off >/tmp/netra-sensors-off.yaml
        if grep -q '/sys/kernel/tracing' /tmp/netra-sensors-off.yaml; then
          echo "agent.hostTracefs=false unexpectedly rendered the tracefs mount" >&2
          exit 1
        fi
        awk '/name: NETRA_TCP_EVENTS$/{getline; if ($0 !~ /"off"/) exit 1}' /tmp/netra-sensors-off.yaml
        awk '/name: NETRA_DROP_INFO$/{getline; if ($0 !~ /"off"/) exit 1}' /tmp/netra-sensors-off.yaml
        # The plain manifest mounts it too.
        grep -q 'mountPath: /sys/kernel/tracing' deploy/agent.yaml
        # Sampled L7 protocol observation reads application payloads: it must render
        # OFF by default, and its port list and rate limit must reach the agent.
        awk '/name: NETRA_L7_SAMPLE$/{getline; if ($0 !~ /"off"/) exit 1}' /tmp/netra.yaml
        if grep -q 'NETRA_L7_SAMPLE_PORTS' /tmp/netra.yaml; then
          echo "NETRA_L7_SAMPLE_PORTS rendered by default" >&2
          exit 1
        fi
        helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set agent.l7Sample=auto --set 'agent.l7SamplePorts=6379:redis\,8080:http1' --set agent.l7SampleGap=250ms >/tmp/netra-l7s.yaml
        awk '/name: NETRA_L7_SAMPLE$/{getline; if ($0 !~ /"auto"/) exit 1}' /tmp/netra-l7s.yaml
        grep -q '6379:redis,8080:http1' /tmp/netra-l7s.yaml
        grep -q '250ms' /tmp/netra-l7s.yaml
        # TLS plaintext sampling is the most sensitive sensor: it must render OFF by
        # default and must not request hostPID unless it (or procmeta) is enabled.
        awk '/name: NETRA_TLS_UPROBES$/{getline; if ($0 !~ /"off"/) exit 1}' /tmp/netra.yaml
        if grep -q 'hostPID' /tmp/netra.yaml; then
          echo "hostPID rendered by default" >&2
          exit 1
        fi
        helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set agent.tlsUprobes=auto --set agent.tlsUprobesComms=nginx >/tmp/netra-tls.yaml
        awk '/name: NETRA_TLS_UPROBES$/{getline; if ($0 !~ /"auto"/) exit 1}' /tmp/netra-tls.yaml
        grep -q 'hostPID: true' /tmp/netra-tls.yaml
        grep -q 'value: "nginx"' /tmp/netra-tls.yaml
        # Listen-queue sampling is a plain env knob (no BPF).
        awk '/name: NETRA_LISTEN_QUEUES$/{getline; if ($0 !~ /"auto"/) exit 1}' /tmp/netra.yaml
        helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set agent.listenQueues=off | awk '/name: NETRA_LISTEN_QUEUES$/{getline; if ($0 !~ /"off"/) exit 1}'
        # The netlink change recorder is a plain env knob too (read-only RTNL).
        grep -q 'name: NETRA_NETLINK$' /tmp/netra.yaml
        awk '/name: NETRA_NETLINK$/{getline; if ($0 !~ /"auto"/) exit 1}' /tmp/netra.yaml
        awk '/name: NETRA_NETLINK_EVENT_BUFFER$/{getline; if ($0 !~ /"4096"/) exit 1}' /tmp/netra.yaml
        helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set agent.netlink=off --set agent.netlinkEventBuffer=8192 >/tmp/netra-netlink.yaml
        awk '/name: NETRA_NETLINK$/{getline; if ($0 !~ /"off"/) exit 1}' /tmp/netra-netlink.yaml
        awk '/name: NETRA_NETLINK_EVENT_BUFFER$/{getline; if ($0 !~ /"8192"/) exit 1}' /tmp/netra-netlink.yaml
        # The BPF attachment inventory is a plain env knob (read-only).
        awk '/name: NETRA_BPF_ATTACH$/{getline; if ($0 !~ /"auto"/) exit 1}' /tmp/netra.yaml
        helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set agent.bpfAttach=off | awk '/name: NETRA_BPF_ATTACH$/{getline; if ($0 !~ /"off"/) exit 1}'
        # Requester attribution for netlink changes is a plain env knob too.
        awk '/name: NETRA_RTNL_ACTOR$/{getline; if ($0 !~ /"auto"/) exit 1}' /tmp/netra.yaml
        helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set agent.rtnlActor=off | awk '/name: NETRA_RTNL_ACTOR$/{getline; if ($0 !~ /"off"/) exit 1}'
    - name: Controller memory limit leaves room for the flow history (OOM regression)
      # 0.27.102 shipped 256Mi and the controller was OOM-killed every ~12
      # minutes on a real cluster. netrad now derives Go's soft limit from the
      # cgroup limit, so the limit must stay a real, sizeable number.
      run: |
        grep -q 'memory: 512Mi' /tmp/netra.yaml
    - name: Agent mTLS is off by default and cannot be half-configured
      # A default render must carry nothing of it, and every unsafe combination must
      # fail at template time, not leave an install whose agents the controller rejects.
      run: |
        A="--set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key"
        if grep -qE 'NETRA_AGENT_MTLS|NETRA_CLIENT_CERT|NETRA_AGENT_CLIENT_CA|agent-mtls' /tmp/netra.yaml; then
          echo "mTLS rendered by default" >&2; exit 1
        fi
        for bad in "--set mtls.mode=on" \
                   "--set mtls.mode=required" \
                   "--set mtls.mode=required --set mtls.secretName=x --set tls.enabled=false" \
                   "--set mtls.mode=required --set mtls.certManager.enabled=true"; do
          if helm template test helm/netra $A $bad >/dev/null 2>&1; then
            echo "unsafe mTLS values rendered: $bad" >&2; exit 1
          fi
        done
        helm template test helm/netra $A --set mtls.mode=required --set mtls.secretName=agent-mtls >/tmp/netra-mtls.yaml
        awk '/name: NETRA_AGENT_MTLS,/{ok=1} END{exit !ok}' /tmp/netra-mtls.yaml
        grep -q 'NETRA_AGENT_CLIENT_CA, value: /mtls/ca.crt' /tmp/netra-mtls.yaml
        grep -q 'NETRA_CLIENT_CERT, value: /mtls/tls.crt' /tmp/netra-mtls.yaml
        # The controller must never mount the agents' private key: only ca.crt.
        awk '/name: agent-mtls-ca$/{f=1} f&&/items:/{print; exit}' /tmp/netra-mtls.yaml | grep -q 'ca.crt'
        if awk '/name: agent-mtls-ca$/{f=1} f&&/tls.key/{found=1} /^---/{f=0} END{exit !found}' /tmp/netra-mtls.yaml; then
          echo "the controller mounts the agents' private key" >&2; exit 1
        fi
        helm template test helm/netra $A --set mtls.mode=optional --set mtls.certManager.enabled=true \
          --set mtls.certManager.issuerRef.name=ca-issuer | grep -q 'kind: Certificate'
    - name: OTLP push is off by default and validated when on
      run: |
        if grep -q 'NETRA_OTLP' /tmp/netra.yaml; then
          echo "OTLP env vars unexpectedly rendered when otlp.enabled is false" >&2
          exit 1
        fi
        if helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key --set otlp.enabled=true >/dev/null 2>&1; then
          echo "otlp.enabled=true without an endpoint unexpectedly rendered" >&2
          exit 1
        fi
        helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set otlp.enabled=true --set otlp.endpoint=http://otel:4318 --set otlp.existingSecret=otel-auth >/tmp/netra-otlp.yaml
        grep -q 'name: NETRA_OTLP_ENDPOINT' /tmp/netra-otlp.yaml
        grep -q 'key: headers' /tmp/netra-otlp.yaml
    - name: OIDC is off by default and validated when on
      run: |
        if grep -q 'NETRA_OIDC' /tmp/netra.yaml; then
          echo "OIDC env vars unexpectedly rendered when auth.oidc.enabled is false" >&2
          exit 1
        fi
        # /metrics token is an optional Secret key so an existing Secret keeps working.
        awk '/name: NETRA_METRICS_TOKEN/{f=1} f&&/optional: true/{ok=1} END{exit !ok}' /tmp/netra.yaml
        if helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key --set auth.oidc.enabled=true >/dev/null 2>&1; then
          echo "auth.oidc.enabled=true without issuer/audience unexpectedly rendered" >&2
          exit 1
        fi
        helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set auth.oidc.enabled=true --set auth.oidc.issuer=https://idp.example --set auth.oidc.audience=netra \
          --set auth.oidc.roleMap='admins=admin' >/tmp/netra-oidc.yaml
        grep -q 'name: NETRA_OIDC_ISSUER' /tmp/netra-oidc.yaml
        grep -q 'name: NETRA_OIDC_AUDIENCE' /tmp/netra-oidc.yaml
        grep -q 'name: NETRA_OIDC_ROLE_MAP' /tmp/netra-oidc.yaml
        helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key --set auth.metricsToken=ci-metrics >/tmp/netra-mt.yaml
        grep -q 'metrics-token: "ci-metrics"' /tmp/netra-mt.yaml
    - name: Workload metrics, SLOs, ServiceMonitor and PrometheusRule are opt-in and well-formed
      run: |
        A=(--set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key)
        # Off by default: nothing new rendered.
        if grep -qE 'kind: (ServiceMonitor|PrometheusRule)|NETRA_SLO_DEFINITIONS|NETRA_METRICS_WORKLOAD' /tmp/netra.yaml; then
          echo "workload metrics / SLO / monitoring objects unexpectedly rendered by default" >&2
          exit 1
        fi
        # The Service must carry labels, or a ServiceMonitor selector matches nothing.
        awk '/^kind: Service$/{f=1} f&&/app.kubernetes.io\/name: netra/{ok=1} /^---/{f=0} END{exit !ok}' /tmp/netra.yaml
        # Everything on, with a token-gated /metrics.
        helm template test helm/netra "${A[@]}" --set auth.metricsToken=ci-metrics \
          --set metrics.serviceMonitor.enabled=true --set metrics.prometheusRule.enabled=true \
          --set metrics.workloadLabels.enabled=true --set metrics.workloadLabels.maxWorkloads=50 \
          --set 'slo.definitions[0].name=checkout' --set 'slo.definitions[0].sli=http_5xx' \
          --set 'slo.definitions[0].targetPct=99.9' >/tmp/netra-e2.yaml
        python3 - <<'PY'
        import yaml
        docs = [d for d in yaml.safe_load_all(open("/tmp/netra-e2.yaml")) if d]
        kinds = {d["kind"] for d in docs}
        assert {"ServiceMonitor", "PrometheusRule"} <= kinds, kinds
        sm = next(d for d in docs if d["kind"] == "ServiceMonitor")["spec"]
        ep = sm["endpoints"][0]
        assert ep["port"] == "https" and ep["scheme"] == "https" and ep["path"] == "/metrics", ep
        assert ep["authorization"]["credentials"]["key"] == "metrics-token", ep
        assert sm["selector"]["matchLabels"] == {"app.kubernetes.io/name": "netra"}, sm
        dep = next(d for d in docs if d["kind"] == "Deployment")
        env = {e["name"]: e.get("value") for c in dep["spec"]["template"]["spec"]["containers"] for e in c.get("env", [])}
        assert env["NETRA_METRICS_WORKLOAD_LABELS"] == "on" and env["NETRA_METRICS_WORKLOAD_MAX"] == "50", env
        assert '"name":"checkout"' in env["NETRA_SLO_DEFINITIONS"], env
        PY
        # Without a token there is no authorization block (an open /metrics needs none).
        helm template test helm/netra "${A[@]}" --set metrics.serviceMonitor.enabled=true >/tmp/netra-sm.yaml
        if grep -q 'authorization:' /tmp/netra-sm.yaml; then
          echo "ServiceMonitor sends a bearer token although none is configured" >&2
          exit 1
        fi
    - name: Loki push is off by default and validated when on
      run: |
        A=(--set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key)
        if grep -q 'NETRA_LOKI' /tmp/netra.yaml; then
          echo "Loki env vars unexpectedly rendered when loki.enabled is false" >&2
          exit 1
        fi
        if helm template test helm/netra "${A[@]}" --set loki.enabled=true >/dev/null 2>&1; then
          echo "loki.enabled=true without a url unexpectedly rendered" >&2
          exit 1
        fi
        helm template test helm/netra "${A[@]}" --set loki.enabled=true --set loki.url=http://loki:3100 \
          --set loki.tenantId=acme --set loki.labels.cluster=prod --set loki.labels.env=live \
          --set loki.existingSecret=loki-auth >/tmp/netra-loki.yaml
        grep -q 'name: NETRA_LOKI_URL' /tmp/netra-loki.yaml
        grep -q 'value: "cluster=prod,env=live"' /tmp/netra-loki.yaml
        grep -q 'key: password' /tmp/netra-loki.yaml
        # Credentials only ever come from the Secret, never from values.
        if grep -q 'name: NETRA_LOKI_PASSWORD' /tmp/netra-loki.yaml && ! grep -A2 'name: NETRA_LOKI_PASSWORD' /tmp/netra-loki.yaml | grep -q secretKeyRef; then
          echo "Loki password rendered as a plain value" >&2
          exit 1
        fi
    - name: Default render must not enable dns/scan detectors
      run: |
        if grep -q 'name: NETRA_DNSDETECT_ENABLED' /tmp/netra.yaml || grep -q 'name: NETRA_SCANDETECT_ENABLED' /tmp/netra.yaml; then
          echo "dnsdetect/scandetect env vars unexpectedly rendered when disabled by default" >&2
          exit 1
        fi
    - name: Default render must not enable multi-channel alerting
      run: |
        if grep -q 'name: NETRA_ALERT_CHANNELS' /tmp/netra.yaml || grep -q 'name: NETRA_ALERT_WEBHOOKS' /tmp/netra.yaml || grep -q 'name: NETRA_ALERT_POLL_INTERVAL' /tmp/netra.yaml; then
          echo "alerting env vars unexpectedly rendered when alerting.enabled=false" >&2
          exit 1
        fi
    - name: Default render must not enable auto-capture
      run: |
        if grep -q 'name: NETRA_AUTO_CAPTURE' /tmp/netra.yaml; then
          echo "auto-capture env unexpectedly rendered when alerting.autoCapture.enabled=false" >&2
          exit 1
        fi
    - run: helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key --set agent.enabled=true >/tmp/netra-agent.yaml
    - run: helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key --set agent.enabled=true --set cilium.enabled=true --set hubble.enabled=true >/tmp/netra-cilium.yaml
    - name: Optional Cilium render must include policy RBAC
      run: grep -q 'cilium.io' /tmp/netra-cilium.yaml
    - name: Optional Cilium render must enable Cilium and Hubble env
      run: |
        awk '/name: NETRA_CILIUM_ENABLED/{getline; if ($0 !~ /"true"/) exit 1}' /tmp/netra-cilium.yaml
        awk '/name: NETRA_HUBBLE_ENABLED/{getline; if ($0 !~ /"true"/) exit 1}' /tmp/netra-cilium.yaml
    - run: helm template test helm/netra --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key --set dnsdetect.enabled=true --set scandetect.enabled=true >/tmp/netra-detectors.yaml
    - name: Optional detector env vars render when enabled
      run: |
        grep -q 'name: NETRA_DNSDETECT_ENABLED' /tmp/netra-detectors.yaml
        grep -q 'name: NETRA_DNSDETECT_INTERVAL' /tmp/netra-detectors.yaml
        grep -q 'name: NETRA_SCANDETECT_ENABLED' /tmp/netra-detectors.yaml
        grep -q 'name: NETRA_SCANDETECT_INTERVAL' /tmp/netra-detectors.yaml
    - name: Render multi-channel alerting with channelsJson
      run: |
        cat > /tmp/alerting-values.yaml <<'EOF'
        alerting:
          enabled: true
          channelsJson: '[{"type":"webhook","name":"ci","url":"https://example.invalid/hook","minSeverity":"warning"}]'
        EOF
        helm template alert helm/netra \
          --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          -f /tmp/alerting-values.yaml \
          >/tmp/netra-alerting.yaml
    - name: Alerting env vars render when enabled
      run: |
        grep -q 'name: NETRA_ALERT_POLL_INTERVAL' /tmp/netra-alerting.yaml
        grep -q 'name: NETRA_ALERT_COOLDOWN' /tmp/netra-alerting.yaml
        grep -q 'name: NETRA_ALERT_WORKERS' /tmp/netra-alerting.yaml
        grep -q 'name: NETRA_ALERT_QUEUE_SIZE' /tmp/netra-alerting.yaml
        grep -q 'name: NETRA_ALERT_CHANNELS' /tmp/netra-alerting.yaml
        grep -q 'example.invalid/hook' /tmp/netra-alerting.yaml
        if grep -q 'name: NETRA_ALERT_WEBHOOKS' /tmp/netra-alerting.yaml; then
          echo "legacy NETRA_ALERT_WEBHOOKS should not render when channelsJson is set" >&2
          exit 1
        fi
    - name: Render legacy alerting webhooksJson when channelsJson unset
      run: |
        cat > /tmp/alerting-legacy-values.yaml <<'EOF'
        alerting:
          enabled: true
          webhooksJson: '[{"name":"ci","url":"https://example.invalid/hook"}]'
        EOF
        helm template alert-legacy helm/netra \
          --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          -f /tmp/alerting-legacy-values.yaml \
          >/tmp/netra-alerting-legacy.yaml
        grep -q 'name: NETRA_ALERT_WEBHOOKS' /tmp/netra-alerting-legacy.yaml
        if grep -q 'name: NETRA_ALERT_CHANNELS' /tmp/netra-alerting-legacy.yaml; then
          echo "NETRA_ALERT_CHANNELS should not render when only webhooksJson is set" >&2
          exit 1
        fi
    - name: Render alerting from existingSecret
      run: |
        helm template alert-secret helm/netra \
          --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set alerting.enabled=true \
          --set alerting.existingSecret=netra-alerting \
          >/tmp/netra-alerting-secret.yaml
        grep -q 'name: NETRA_ALERT_CHANNELS' /tmp/netra-alerting-secret.yaml
        grep -q 'secretKeyRef' /tmp/netra-alerting-secret.yaml
        grep -q 'key: channels-json' /tmp/netra-alerting-secret.yaml
    - name: Render auto-capture when enabled
      run: |
        helm template autocap helm/netra \
          --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set alerting.autoCapture.enabled=true \
          >/tmp/netra-autocapture.yaml
        grep -q 'name: NETRA_AUTO_CAPTURE' /tmp/netra-autocapture.yaml
        awk '/name: NETRA_AUTO_CAPTURE$/{getline; if ($0 !~ /"true"/) exit 1}' /tmp/netra-autocapture.yaml
        grep -q 'name: NETRA_AUTO_CAPTURE_DIR' /tmp/netra-autocapture.yaml
        grep -q 'name: NETRA_AUTO_CAPTURE_DURATION' /tmp/netra-autocapture.yaml
        grep -q 'name: NETRA_AUTO_CAPTURE_COOLDOWN' /tmp/netra-autocapture.yaml
        grep -q 'name: NETRA_AUTO_CAPTURE_MAX_PPS' /tmp/netra-autocapture.yaml
        grep -q 'name: NETRA_AUTO_CAPTURE_MAX_CONCURRENT' /tmp/netra-autocapture.yaml
        grep -q 'name: NETRA_AUTO_CAPTURE_MAX_ARTIFACTS' /tmp/netra-autocapture.yaml
        # With default persistence.enabled, PCAPs land under the state PVC
        # (/var/lib/netra/auto-capture). emptyDir is only used without PVC.
        helm template autocap-ed helm/netra \
          --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set alerting.autoCapture.enabled=true \
          --set persistence.enabled=false \
          >/tmp/netra-autocapture-ed.yaml
        grep -q 'name: auto-capture' /tmp/netra-autocapture-ed.yaml
        grep -q 'mountPath: "/var/lib/netra/auto-capture"' /tmp/netra-autocapture-ed.yaml
        # Auto-capture alone (no notify channels) must still render — the
        # poller runs when NETRA_AUTO_CAPTURE=true even without webhooks.
        if grep -q 'name: NETRA_ALERT_CHANNELS' /tmp/netra-autocapture.yaml || grep -q 'name: NETRA_ALERT_WEBHOOKS' /tmp/netra-autocapture.yaml; then
          echo "auto-capture-only render unexpectedly set alert channel env" >&2
          exit 1
        fi
        # Optional AF_PACKET backend for CI / agentless capture.
        helm template autocap-be helm/netra \
          --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set alerting.autoCapture.enabled=true \
          --set alerting.autoCapture.backend=afpacket \
          >/tmp/netra-autocapture-be.yaml
        grep -q 'name: NETRA_AUTO_CAPTURE_BACKEND' /tmp/netra-autocapture-be.yaml
        awk '/name: NETRA_AUTO_CAPTURE_BACKEND$/{getline; if ($0 !~ /afpacket/) exit 1}' /tmp/netra-autocapture-be.yaml
    - name: Standalone render must expose workload attribution safely
      run: |
        grep -q 'resources: \["pods","services"\]' /tmp/netra-agent.yaml
        grep -q '/sys/fs/cgroup' /tmp/netra-agent.yaml
        grep -q '/dev/kmsg' /tmp/netra-agent.yaml
        grep -q 'NETRA_CGROUP_ENABLED' /tmp/netra-agent.yaml
        grep -q 'NETRA_CGROUP_SCAN_INTERVAL' /tmp/netra-agent.yaml
        grep -q 'automountServiceAccountToken: false' /tmp/netra-agent.yaml
    - name: HA must reject a chart-managed RWO volume
      run: |
        if helm template bad-ha helm/netra \
          --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set ha.enabled=true --set replicaCount=3 >/tmp/netra-bad-ha.yaml 2>/tmp/netra-bad-ha.err; then
          echo "chart unexpectedly allowed HA on the default RWO claim" >&2
          exit 1
        fi
    - name: Render HA with RWX storage
      run: |
        helm template ha helm/netra \
          --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set ha.enabled=true --set replicaCount=3 \
          --set 'persistence.accessModes[0]=ReadWriteMany' >/tmp/netra-ha.yaml
        grep -q 'kind: PodDisruptionBudget' /tmp/netra-ha.yaml
        grep -q 'coordination.k8s.io' /tmp/netra-ha.yaml
        grep -q 'NETRA_HA_ENABLED' /tmp/netra-ha.yaml
        grep -q 'path: /readyz' /tmp/netra-ha.yaml
  ebpf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7
    - run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev nftables
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: Runner kernel facts (BTF, tracepoint record layouts)
      # Tracepoint record layouts change between kernels (tcp_send_reset moved
      # from sport/dport/family to sockaddr-style saddr/daddr), so the layout
      # files this runner's kernel actually has are printed here: they are the
      # source for the fixtures in internal/tpformat/testdata, and the first
      # thing to read when a TestTCPEvents*/TestDropInfo* case fails on a new
      # runner image.
      run: |
        uname -a
        ls -l /sys/kernel/btf/vmlinux || echo "no kernel BTF"
        for e in tcp/tcp_retransmit_skb tcp/tcp_send_reset tcp/tcp_receive_reset sock/inet_sock_set_state skb/kfree_skb; do
          echo "=== $e"
          sudo cat "/sys/kernel/tracing/events/$e/format" || echo "(unreadable)"
        done
    - name: eBPF C helpers + compile + privileged PROG_TEST_RUN (scripted)
      # Same entrypoint locally: sudo ./scripts/ci-ebpf-tests.sh
      # Covers bpf/tests/*.c, clang of every bpf/netra_*.c,
      # and bpf/integration (including TestTLSFP*, TestTCPEvents* and
      # TestDropInfo*, which attach real tracepoints on the runner's kernel; nft
      # induces the loss. TestDropInfo* skip where the runner kernel has no BTF).
      run: sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=${GOPATH:-$HOME/go}" "GOMODCACHE=${GOMODCACHE:-}" "GOCACHE=${GOCACHE:-}" ./scripts/ci-ebpf-tests.sh
  auto-capture-veth:
    # Privileged Linux smoke for opt-in auto-capture: veth + iperf3 TCP +
    # AF_PACKET feeder → non-empty PCAP under NETRA_AUTO_CAPTURE_DIR, plus
    # the sibling drop-incident context JSON (node, CPU/memory hot, live
    # iperf3 pid/comm). Softnet trigger is synthetic (≥1000) so CI does not
    # depend on flaky real softnet counters under GitHub-hosted load.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: Install iperf3
      run: sudo apt-get update && sudo apt-get install -y iperf3 iproute2
    - name: Auto-capture veth + iperf3 smoke
      run: sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=${GOPATH:-$HOME/go}" "GOMODCACHE=${GOMODCACHE:-}" "GOCACHE=${GOCACHE:-}" ./scripts/ci-auto-capture-veth.sh
  flow-observe-veth:
    # Privileged Linux smoke for flow history, RED, port hints, process
    # join, inferred traces, /proc stack profiles, the workload-events
    # contract, and the unlabeled flowlog gauge. iperf3 TCP on a veth;
    # reports carry that interface's RX counters. No eBPF agent.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: Install iperf3
      run: sudo apt-get update && sudo apt-get install -y iperf3 iproute2
    - name: Flow observe veth + iperf3 smoke
      run: sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=${GOPATH:-$HOME/go}" "GOMODCACHE=${GOMODCACHE:-}" "GOCACHE=${GOCACHE:-}" ./scripts/ci-flow-observe-veth.sh
  metrics-veth-smoke:
    # Privileged Linux smoke for the per-second metrics platform: the real host
    # collectors, anomaly detector and stream sender feed a real netrad; iperf3
    # load on a veth must move net.net and TCP series, get flagged as anomalous
    # after a quiet training phase, and fire a mounted metric alert rule. No eBPF.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: Install iperf3
      run: sudo apt-get update && sudo apt-get install -y iperf3 iproute2
    - name: Metrics veth + iperf3 smoke
      run: sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=${GOPATH:-$HOME/go}" "GOMODCACHE=${GOMODCACHE:-}" "GOCACHE=${GOCACHE:-}" ./scripts/ci-metrics-veth.sh
  netlink-veth-smoke:
    # Privileged Linux smoke for the read-only RTNL change recorder. Runs the
    # real recorder against a real kernel inside a throwaway network namespace:
    # veth address/route/neighbor/MTU/carrier changes are recorded, and a route
    # storm that overflows the kernel receive buffer (ENOBUFS) is counted, the
    # subscription is re-established and later changes are seen. No eBPF.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: Install iproute2
      run: sudo apt-get update && sudo apt-get install -y iproute2
    - name: Netlink recorder veth smoke
      run: sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=${GOPATH:-$HOME/go}" "GOMODCACHE=${GOMODCACHE:-}" "GOCACHE=${GOCACHE:-}" ./scripts/ci-netlink-veth.sh
  http-status-smoke:
    # Privileged Linux smoke for cleartext HTTP/1 status. The SNI/Host scan
    # programs may fail the verifier; the status programs must still attach
    # and count an HTTP/1.1 503 whose status line starts the packet.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: Install clang
      run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev iproute2 ethtool
    - name: HTTP/1 status smoke
      run: sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=${GOPATH:-$HOME/go}" "GOMODCACHE=${GOMODCACHE:-}" "GOCACHE=${GOCACHE:-}" ./scripts/ci-http-status-smoke.sh
  tlsfp-smoke:
    # Privileged Linux smoke for always-on JA3/JA4: compile netra_tlsfp.o,
    # BPF_PROG_TEST_RUN sampler tests, then live agent + openssl ClientHello
    # (+ iperf3 TCP background) → uniqueJa3 > 0 on the controller API.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: Install clang, iperf3, openssl
      run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev iperf3 iproute2 openssl
    - name: TLS fingerprint openssl + iperf3 smoke
      run: sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=${GOPATH:-$HOME/go}" "GOMODCACHE=${GOMODCACHE:-}" "GOCACHE=${GOCACHE:-}" ./scripts/ci-tlsfp-smoke.sh
  ebpf-arm64:
    # The same privileged suite on a real arm64 kernel. The agent image ships for
    # arm64, and everything BPF here (CO-RE drop attribution, the TCP event layouts,
    # listen queues, the packet-level L7 sampler, the OpenSSL uprobes' register
    # layout) was otherwise only ever run on x86_64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7
    - run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev nftables python3 openssl
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: eBPF compile + privileged tests on arm64 (scripted)
      # Same entrypoint locally: sudo ./scripts/ci-ebpf-tests.sh
      run: sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=${GOPATH:-$HOME/go}" "GOMODCACHE=${GOMODCACHE:-}" "GOCACHE=${GOCACHE:-}" ./scripts/ci-ebpf-tests.sh
  tlssample-smoke:
    # The real agent and controller with NETRA_TLS_UPROBES=required, a real HTTPS
    # server and client, real TLS: exact per-role method/status counts in the API and
    # /metrics, and secrets planted in the path, query string, a cookie and a bearer
    # token that must appear nowhere the agent or controller exposes.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: Install clang
      run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev python3 openssl
    - name: TLS plaintext sampling end to end (scripted)
      # Same command locally: sudo ./scripts/ci-tlssample-smoke.sh
      run: sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=${GOPATH:-$HOME/go}" "GOMODCACHE=${GOMODCACHE:-}" "GOCACHE=${GOCACHE:-}" ./scripts/ci-tlssample-smoke.sh
  lint:
    # Bug-finding linters only (.golangci.yml), reporting only issues a change
    # introduces, so the existing backlog does not block unrelated work.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with: {fetch-depth: 0}
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.2
        only-new-issues: true
  security:
    # Known-vulnerable dependencies that the code can actually reach. Pinned so a
    # new scanner release cannot turn CI red by itself; bump deliberately.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: govulncheck
      # Same command locally: ./scripts/ci-govulncheck.sh
      run: ./scripts/ci-govulncheck.sh
  python:
    # The LangGraph companion (python/netra_langgraph) had tests nothing ran.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with: {python-version: '3.12'}
    - name: Python unit tests (min count)
      # Same command locally: make test-python
      run: |
        out="$(make test-python 2>&1)" || { echo "$out"; exit 1; }
        echo "$out"
        n="$(sed -n 's/^Ran \([0-9]*\) tests.*/\1/p' <<<"$out")"
        [ "${n:-0}" -ge 7 ] || { echo "only ${n:-0} python tests ran, expected at least 7" >&2; exit 1; }
  mcp-live:
    # The MCP server (netra-mcp) against a real netrad over stdio JSON-RPC: read-only
    # by default, every mutating tool present only when enabled (names read from the
    # source), a real deny rule added and removed through MCP with the MCP actor in
    # the audit log, malformed input and a wrong key handled.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: MCP server against a live controller (scripted)
      # Same command locally: ./scripts/ci-mcp-live.sh
      run: ./scripts/ci-mcp-live.sh
  persistence-live:
    # State survives kill -9 and restarts, an enforcement lease is never resurrected,
    # a second controller and a corrupt state file are refused, a damaged flow sidecar
    # is set aside, and without a state file nothing persists.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: Controller state persistence (scripted)
      # Same command locally: ./scripts/ci-persistence-live.sh
      run: ./scripts/ci-persistence-live.sh
  sinks-live:
    # Webhook, Slack, Teams, HTTP bridge, SMTP, OTLP and syslog (UDP and TCP)
    # delivered for real to loopback receivers: format, exactly-once, severity filter,
    # retry, HMAC signatures, and no secret in any body, log line or API response.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: Alert and export sinks (scripted)
      # Same command locally: ./scripts/ci-sinks-live.sh
      run: ./scripts/ci-sinks-live.sh
  doctor-live:
    # netra-doctor on the runner itself (the agent's kernel, cgroup, bpffs, BTF and
    # tracefs requirements) and on an empty root (must fail loudly with remediation).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: netra-doctor as root, like the agent (scripted)
      # Same command locally: sudo ./scripts/ci-doctor-live.sh
      # Root matters: tracefs and the BPF filesystem are not readable without it, and the
      # agent runs privileged.
      run: sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=${GOPATH:-$HOME/go}" "GOMODCACHE=${GOMODCACHE:-}" "GOCACHE=${GOCACHE:-}" ./scripts/ci-doctor-live.sh
  enforce-veth:
    # A real agent on a veth: deny/allow/CIDR/port rules drop exactly what they name in
    # enforce mode and never in observe, ingress vs egress, IPv6, the drop is recorded, a
    # lease expires on its own, and the agent fails open when the controller dies.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: Install clang
      run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev
    - name: Enforcement on a veth (scripted)
      # Same command locally: sudo ./scripts/ci-enforce-veth.sh
      run: sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=${GOPATH:-$HOME/go}" "GOMODCACHE=${GOMODCACHE:-}" "GOCACHE=${GOCACHE:-}" ./scripts/ci-enforce-veth.sh
  capture-live:
    # Manual packet capture on both backends (eBPF, AF_PACKET) through the API and the
    # WebSocket, saved as a pcap that tcpdump reads: filter, both directions, stop, history.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: Install clang and tcpdump
      run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev tcpdump
    - name: Manual capture on both backends (scripted)
      # Same command locally: sudo ./scripts/ci-capture-live.sh
      run: sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=${GOPATH:-$HOME/go}" "GOMODCACHE=${GOMODCACHE:-}" "GOCACHE=${GOCACHE:-}" ./scripts/ci-capture-live.sh
  kind-lifecycle:
    # The previous release installs and takes state; helm upgrade --reset-then-reuse-values to
    # this checkout with the agent DaemonSet; a pod restart; helm rollback. State and the API
    # key survive every step.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v7
      with: {fetch-depth: 0}
    - uses: azure/setup-helm@v5
    - uses: helm/kind-action@v1
      with: {cluster_name: netra-ci}
    - name: Install, upgrade, restart and roll back on a real cluster (scripted)
      # Same command locally: ./scripts/ci-kind-lifecycle.sh (a running kind cluster)
      # With no release tag there is nothing to upgrade from: skip with a warning annotation, do not fail.
      env: {ALLOW_NO_PREVIOUS_TAG: '1'}
      run: ./scripts/ci-kind-lifecycle.sh
  manifests-kind:
    # The plain manifests an operator applies with kubectl (no Helm): controller, state volume,
    # agent DaemonSet, API auth.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: helm/kind-action@v1
      with: {cluster_name: netra-ci}
    - name: The plain manifests on a real cluster (scripted)
      # Same command locally: ./scripts/ci-manifests-kind.sh (a running kind cluster)
      run: ./scripts/ci-manifests-kind.sh
  web-e2e:
    # A real browser against a real controller serving the built UI, no interception:
    # login (refused, accepted, sign-out), every page, seeded data on screen, and a deny
    # rule and the enforcement lease through the Firewall page.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - uses: actions/setup-node@v7
      with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
    - run: npm --prefix web ci
    - run: npm --prefix web run build
    - run: cd web && npx playwright install --with-deps chromium
    - name: The UI against a real controller (scripted)
      # Same command locally: ./scripts/ci-web-e2e.sh (needs Playwright's chromium)
      run: OUT_DIR=/tmp/netra-web-e2e ./scripts/ci-web-e2e.sh
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: web-e2e-evidence
        path: /tmp/netra-web-e2e
  mtls-smoke:
    # The real netrad (every unsafe mTLS setting refused at startup; required mode
    # enforcing certificate, issuer and key usage) and the real agent, with and
    # without a client certificate, and with the certificate renewed under it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: Install clang
      run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev openssl
    - name: Agent to controller mutual TLS end to end (scripted)
      # Same command locally: sudo ./scripts/ci-mtls-smoke.sh (controller half runs on any OS)
      run: sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=${GOPATH:-$HOME/go}" "GOMODCACHE=${GOMODCACHE:-}" "GOCACHE=${GOCACHE:-}" ./scripts/ci-mtls-smoke.sh
  l7sample-smoke:
    # The real agent and controller with NETRA_L7_SAMPLE=required, fake Redis and
    # PostgreSQL servers on loopback, real traffic: exact per-role operation counts
    # in the API and /metrics, the kernel's eligible/emitted counters, and a
    # planted secret that must appear nowhere the agent or controller exposes.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: Install clang
      run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev
    - name: Sampled L7 protocol observation end to end (scripted)
      # Same command locally: sudo ./scripts/ci-l7sample-smoke.sh
      run: sudo -E env "PATH=$PATH" "HOME=$HOME" "GOPATH=${GOPATH:-$HOME/go}" "GOMODCACHE=${GOMODCACHE:-}" "GOCACHE=${GOCACHE:-}" ./scripts/ci-l7sample-smoke.sh
  agent-image:
    # Builds Dockerfile.agent with the image's own clang and checks what
    # shipped: the agent binary and a BPF object for every bpf/netra_*.c. A
    # sensor added under bpf/ but not to the Dockerfile builds, passes every
    # unit test, and ships an agent that quietly never loads it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Build the agent image and verify its BPF objects (scripted)
      # Same command locally: ./scripts/ci-agent-image.sh
      run: ./scripts/ci-agent-image.sh
  kind-e2e:
    # Real-cluster install of the chart (kind): RBAC, the TLS init container,
    # probes and auth enforcement — things `helm template` cannot catch. The
    # agent is off here because it needs privileged BPF; the veth jobs above
    # cover the datapath.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: azure/setup-helm@v5
    - uses: helm/kind-action@v1
      with: {cluster_name: netra-ci}
    - name: Build controller image and load it into kind
      run: |
        docker build -t ghcr.io/zyvorai/netra:ci .
        kind load docker-image ghcr.io/zyvorai/netra:ci --name netra-ci
    - name: helm install (waits for readiness)
      run: |
        helm install netra helm/netra --namespace netra-system --create-namespace \
          --set image.tag=ci --set image.pullPolicy=Never \
          --set auth.apiKey=ci-api-key --set auth.agentKey=ci-agent-key \
          --set auth.metricsToken=ci-metrics-token \
          --set agent.enabled=false --set persistence.enabled=false \
          --wait --timeout 5m
    - name: API answers and enforces auth
      run: |
        kubectl -n netra-system port-forward svc/netra 30870:30870 &
        pf=$!
        trap 'kill $pf' EXIT
        for _ in $(seq 1 30); do
          curl -ksf https://127.0.0.1:30870/healthz >/dev/null && break
          sleep 1
        done
        curl -ksf https://127.0.0.1:30870/healthz
        code=$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:30870/api/v1/status)
        [ "$code" = 401 ] || { echo "unauthenticated /api/v1/status returned $code, want 401"; exit 1; }
        curl -ksf -H 'Authorization: Bearer ci-api-key' https://127.0.0.1:30870/api/v1/status
        # The Secret-provided metrics token really reached the pod's env.
        code=$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:30870/metrics)
        [ "$code" = 401 ] || { echo "unauthenticated /metrics returned $code, want 401"; exit 1; }
        curl -ksf -H 'Authorization: Bearer ci-metrics-token' https://127.0.0.1:30870/metrics | grep -q '^netra_rbac_denied_total '
        curl -ksf https://127.0.0.1:30870/healthz >/dev/null
        curl -ksf -H 'Authorization: Bearer ci-api-key' https://127.0.0.1:30870/api/v1/whoami | grep -q '"role":"admin"'
    - name: Dump cluster state on failure
      if: failure()
      run: |
        kubectl -n netra-system get all,pvc,events -o wide || true
        kubectl -n netra-system logs deploy/netra --all-containers --tail=200 || true
  oidc-live:
    # The real netrad binary against a throwaway OIDC provider
    # (cmd/netra-ci-idp): role ladder, every way a token can be wrong, IdP
    # outage/recovery, audit attribution a header cannot spoof, /metrics gate.
    # No root, cluster, or real IdP. Same command locally:
    # ./scripts/ci-oidc-live.sh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: OIDC + RBAC against a live netrad
      run: ./scripts/ci-oidc-live.sh
  workload-obs-live:
    # The real netrad fed synthetic agent reports over POST /api/v1/agents/report:
    # growth, the cardinality cap + __other__, an agent counter reset, a vanished
    # workload, an SLO burn that pages and is audited, and monotonic counters
    # throughout. No root, cluster or agent. Same command locally:
    # ./scripts/ci-workload-obs-live.sh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: Per-workload metrics + SLO against a live netrad
      run: ./scripts/ci-workload-obs-live.sh
  prometheus-rules:
    # The chart's PrometheusRule rendered and unit-tested with promtool:
    # `check rules`, then `test rules` with synthetic series asserting when each
    # alert does and does not fire. Same command locally (promtool on PATH):
    # ./scripts/ci-prometheus-rules.sh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: azure/setup-helm@v5
    - run: pip install pyyaml
    - name: Install promtool (pinned, checksum-verified)
      run: |
        v=3.5.0
        f=prometheus-${v}.linux-amd64.tar.gz
        curl -fsSL -o "$f" "https://github.com/prometheus/prometheus/releases/download/v${v}/${f}"
        echo "e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a  ${f}" | sha256sum -c -
        tar xzf "$f" --strip-components=1 "prometheus-${v}.linux-amd64/promtool"
        sudo install -m 0755 promtool /usr/local/bin/promtool
        promtool --version
    - name: promtool check + test the chart's alert rules
      run: ./scripts/ci-prometheus-rules.sh
  loki-live:
    # The real netrad pushing to a real (multi-tenant) Loki, read back through
    # Loki's own API: audit and block events, `| json`, bounded labels, tenancy,
    # and events made during a Loki outage arriving after it returns.
    # Same command locally: LOKI_BIN=/path/to/loki ./scripts/ci-loki-live.sh
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - name: Install Loki (pinned, checksum-verified)
      run: |
        v=3.7.8
        curl -fsSL -o loki.zip "https://github.com/grafana/loki/releases/download/v${v}/loki-linux-amd64.zip"
        echo "62aea42c9cba52cd1642b3666ab37019a0ce4c24ab50b07e85dccc8d812f7d61  loki.zip" | sha256sum -c -
        unzip -q loki.zip
        chmod +x loki-linux-amd64
        echo "LOKI_BIN=$PWD/loki-linux-amd64" >> "$GITHUB_ENV"
    - name: netrad -> Loki, verified through Loki's API
      run: ./scripts/ci-loki-live.sh
