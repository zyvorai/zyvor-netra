name: macOS release
# Tag macos-vX.Y.Z (or manual dispatch) -> Netra.app + Netra.dmg. The app is signed with a Developer ID
# identity and the dmg notarized ONLY when the repository secrets below exist; otherwise the build is
# ad-hoc signed and is not distributable to other Macs without a Gatekeeper override.
#
# Secrets (Settings > Secrets and variables > Actions), all optional:
#   MACOS_CERT_P12_BASE64   base64 of the Developer ID Application certificate + key (.p12)
#   MACOS_CERT_PASSWORD     password of that .p12
#   MACOS_SIGN_IDENTITY     identity name, e.g. "Developer ID Application: Example (TEAMID)"
#   NOTARY_API_KEY_BASE64   base64 of the App Store Connect API key (.p8)
#   NOTARY_API_KEY_ID       API key id
#   NOTARY_API_ISSUER       API issuer id
on:
  push:
    tags: ['macos-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write   # draft release on a tag
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_API_KEY_BASE64 != '' && secrets.NOTARY_API_KEY_ID != '' && secrets.NOTARY_API_ISSUER != '' }}
    steps:
    - uses: actions/checkout@v7
      with: {fetch-depth: 0}
    - name: Test
      run: swift test --package-path macos
    - name: Import signing certificate into a temporary keychain
      if: env.HAS_SIGNING == 'true'
      env:
        CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      run: |
        kc="$RUNNER_TEMP/netra-build.keychain-db"
        pw="$(uuidgen)"
        echo "::add-mask::$pw"
        printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security create-keychain -p "$pw" "$kc"
        security set-keychain-settings -lut 3600 "$kc"
        security unlock-keychain -p "$pw" "$kc"
        security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc"
        security list-keychains -d user -s "$kc" login.keychain-db
        rm -f "$RUNNER_TEMP/cert.p12"
        echo "CODESIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
        echo "CODESIGN_IDENTITY=${{ secrets.MACOS_SIGN_IDENTITY }}" >> "$GITHUB_ENV"
    - name: Write notarization API key
      if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
      env:
        KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
      run: |
        printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
        echo "NOTARY_API_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
        echo "NOTARY_API_KEY_ID=${{ secrets.NOTARY_API_KEY_ID }}" >> "$GITHUB_ENV"
        echo "NOTARY_API_ISSUER=${{ secrets.NOTARY_API_ISSUER }}" >> "$GITHUB_ENV"
    - name: Build Netra.app
      env:
        OUT_DIR: ${{ github.workspace }}/macos/dist
      run: ./macos/Packaging/build-app.sh
    - name: Build Netra.dmg (sign and notarize when configured)
      env:
        OUT_DIR: ${{ github.workspace }}/macos/dist
      run: ./macos/Packaging/make-dmg.sh
    - name: Clean up keychain and key
      if: always()
      run: |
        security delete-keychain "$RUNNER_TEMP/netra-build.keychain-db" 2>/dev/null || true
        rm -f "$RUNNER_TEMP/notary.p8"
    - uses: actions/upload-artifact@v7
      with:
        name: Netra-dmg
        path: macos/dist/Netra.dmg
        if-no-files-found: error
    - name: Draft GitHub release
      if: startsWith(github.ref, 'refs/tags/macos-v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" macos/dist/Netra.dmg --draft --title "Netra for macOS ${GITHUB_REF_NAME#macos-v}" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" macos/dist/Netra.dmg --clobber
