name: Release
# Tag vX.Y.Z -> multi-arch controller + agent images on ghcr.io, keyless cosign
# signatures, and SBOM + provenance attestations. The tag must match the
# version in cmd/netrad/main.go (scripts/check-version-sync.sh gates that).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # One release run per ref; a re-run or double dispatch queues behind it, never cancels a publish.
  group: release-${{ github.ref }}
  cancel-in-progress: false
# Heavy, trusted jobs run on the org self-hosted runners (group zyvor-build). The expression
# falls back to a hosted runner for any pull_request event, so a fork PR can never reach them.
# This workflow has no pull_request trigger; the guard keeps it that way if one is added.
jobs:
  verify:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || '["self-hosted","zyvor-build","docker"]') }}
    steps:
    - uses: actions/checkout@v7
    - name: Version files agree
      run: ./scripts/check-version-sync.sh
    - name: Tag matches the code version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        want=$(sed -n 's/^const version = "\(.*\)"$/\1/p' cmd/netrad/main.go)
        [ "${GITHUB_REF_NAME#v}" = "$want" ] || { echo "tag ${GITHUB_REF_NAME} != code version ${want}"; exit 1; }
  images:
    needs: verify
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || '["self-hosted","zyvor-build","docker"]') }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - {image: netra, dockerfile: Dockerfile}
        - {image: netra-agent, dockerfile: Dockerfile.agent}
        - {image: netra-mcp, dockerfile: Dockerfile.mcp}
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
      with:
        version: v0.19.3   # the self-hosted host has no buildx plugin; this installs it per job
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/zyvorai/${{ matrix.image }}
        tags: |
          type=semver,pattern={{version}}
          type=sha
    - id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        sbom: true
        provenance: mode=max
    - uses: sigstore/cosign-installer@v3
    - name: Sign the image digest (keyless)
      run: cosign sign --yes ghcr.io/zyvorai/${{ matrix.image }}@${{ steps.build.outputs.digest }}
  publish-mcp:
    # Registry metadata only: the image above is what clients pull. Tag pushes only.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || '["self-hosted","zyvor-build","docker"]') }}
    permissions:
      contents: read
      id-token: write   # GitHub OIDC login to the MCP Registry, no long-lived token
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
    - uses: actions/checkout@v7
    - name: Install mcp-publisher (pinned)
      run: |
        curl -fsSL -o mcp-publisher.tar.gz \
          "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
        echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
        tar xzf mcp-publisher.tar.gz mcp-publisher
    - run: ./mcp-publisher validate server.json
    - run: ./mcp-publisher login github-oidc
    - run: ./mcp-publisher publish server.json
