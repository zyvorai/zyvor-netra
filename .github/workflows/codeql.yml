name: CodeQL
# Static analysis for Go and the web app. Findings appear under Security > Code
# scanning; the job itself fails only if the analysis cannot run.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
  - cron: '17 3 * * 1'
permissions:
  contents: read
  security-events: write
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      if: matrix.language == 'go'
      with: {go-version: '1.27.1', cache: true}
    - uses: github/codeql-action/init@v4
      with: {languages: '${{ matrix.language }}'}
    - uses: github/codeql-action/autobuild@v4
    - uses: github/codeql-action/analyze@v4
      with: {category: '/language:${{ matrix.language }}'}
