name: Release dry run
# Everything the tag-triggered release does except pushing, signing and attesting,
# so a change that would break a release is found in the pull request that makes it,
# not on the day someone tags. Multi-arch (QEMU) builds run nightly (nightly.yml).
on:
  pull_request:
    paths:
    - 'Dockerfile*'
    - 'bpf/**'
    - 'go.mod'
    - 'go.sum'
    - 'cmd/**'
    - 'web/package*.json'
    - 'scripts/check-version-sync.sh'
    - '.github/workflows/release*.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: release-dryrun-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # The same two gates release.yml runs first, with the tag the release would use.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
    - run: ./scripts/check-version-sync.sh
    - name: A tag for this version would match the code
      run: |
        want=$(sed -n 's/^const version = "\(.*\)"$/\1/p' cmd/netrad/main.go)
        [ -n "$want" ] || { echo "cannot read the version from cmd/netrad/main.go" >&2; exit 1; }
        tag="v${want}"
        [ "${tag#v}" = "$want" ]
        echo "a release of ${tag} would pass the tag check"
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - {image: netra, dockerfile: Dockerfile}
        - {image: netra-agent, dockerfile: Dockerfile.agent}
        - {image: netra-mcp, dockerfile: Dockerfile.mcp}
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - name: Build ${{ matrix.dockerfile }} (linux/amd64, not pushed)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        load: true
        push: false
        tags: netra-dryrun/${{ matrix.image }}:ci
        cache-from: type=gha,scope=${{ matrix.image }}
        cache-to: type=gha,scope=${{ matrix.image }},mode=max
    - name: The controller image boots and answers
      if: matrix.image == 'netra'
      run: |
        cid=$(docker run -d -p 30870:30870 -e NETRA_ALLOW_UNAUTHENTICATED=true netra-dryrun/netra:ci)
        trap 'docker logs "$cid" | tail -n 20; docker rm -f "$cid" >/dev/null' EXIT
        for _ in $(seq 1 40); do curl -sf http://127.0.0.1:30870/healthz >/dev/null && break; sleep 0.5; done
        curl -sf http://127.0.0.1:30870/healthz
        curl -sf http://127.0.0.1:30870/livez | grep -q '"service":"netrad"'
        # The UI ships in the image: the root page is HTML, not a 404.
        curl -sf http://127.0.0.1:30870/ | grep -qi '<html'
        # ...and so do its static files. An unknown path answers 200 with the HTML fallback, so only
        # fetching the logo and favicon and comparing them with web/public proves they are there.
        ./scripts/check-served-ui.sh http://127.0.0.1:30870
  mcp-registry:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: server.json validates against the registry schema
      run: |
        curl -fsSL -o mcp-publisher.tar.gz \
          https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
        tar xzf mcp-publisher.tar.gz mcp-publisher
        ./mcp-publisher validate server.json
  runtime-image:
    # Dockerfile.runtime is the thin image the remote deploy path uses; nothing built it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with: {go-version: '1.27.1', cache: true}
    - uses: actions/setup-node@v7
      with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
    - name: Prebuild the inputs Dockerfile.runtime copies
      run: |
        mkdir -p bin
        CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/netrad ./cmd/netrad
        CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/netractl ./cmd/netractl
        npm --prefix web ci && npm --prefix web run build
    - run: docker build -f Dockerfile.runtime -t netra-dryrun/runtime:ci .
    - name: The thin image boots, serves the UI, and ships netractl
      run: |
        cid=$(docker run -d -p 30871:30870 -e NETRA_ALLOW_UNAUTHENTICATED=true netra-dryrun/runtime:ci)
        trap 'docker logs "$cid" | tail -n 20; docker rm -f "$cid" >/dev/null' EXIT
        for _ in $(seq 1 40); do curl -sf http://127.0.0.1:30871/healthz >/dev/null && break; sleep 0.5; done
        curl -sf http://127.0.0.1:30871/livez | grep -q '"service":"netrad"'
        curl -sf http://127.0.0.1:30871/ | grep -qi '<html'
        ./scripts/check-served-ui.sh http://127.0.0.1:30871
        docker run --rm --entrypoint /usr/local/bin/netractl netra-dryrun/runtime:ci --help >/dev/null
